schema = "supernutrition.inference-engine-compatibility-matrix.v2"
contract_id = "inference-engine"
release = "v2"
previous_release = "photo-inference-engine/v1"
digest = "3d9d1aa1e9ef44e4e97d024c651f852c7e9ef6b7a0a47e22953be50186d3d131"

# v1 remains published. Consumers migrate release by release rather than in one
# step, so both releases are supported simultaneously and v1 is retired only
# when no implementation remains.

[[supported_pair]]
producer = "domain-inference-v2"
consumer = "local-android-v2"
direction = "forward"
expected = "accepted"

[[supported_pair]]
producer = "domain-inference-v2"
consumer = "local-ios-v2"
direction = "forward"
expected = "accepted"

[[supported_pair]]
producer = "domain-inference-v2"
consumer = "local-text-v2"
direction = "forward"
expected = "accepted"

[[supported_pair]]
producer = "domain-inference-v2"
consumer = "remote-v2"
direction = "forward"
expected = "accepted"

[[supported_pair]]
producer = "domain-inference-v2"
consumer = "evaluation-v2"
direction = "forward"
expected = "accepted"

# A v1 consumer cannot read a v2 text request: the modality discriminator and
# text payload do not exist in v1, and v1 requires a photo. Recorded explicitly
# so the migration cannot be mistaken for transparent.
[[supported_pair]]
producer = "domain-inference-v2"
consumer = "local-android-v1"
direction = "backward"
expected = "rejected"
