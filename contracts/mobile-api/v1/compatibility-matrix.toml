schema = "supernutrition.mobile-api-compatibility-matrix.v1"
contract_id = "mobile-api"
release = "v1"
digest = "2e2775c939219557ee967c128f384dd149c82e6b6e8c20923c8d347efe59d2f3"

# The digest is SHA-256 over every sorted TOML file in this release. Each entry
# contributes its release-relative path, a zero byte, then its bytes. While
# hashing this file, the digest value is replaced by the literal
# `<release-digest>` to avoid a self-reference.
#
# Any change to any contract file changes the digest. That is the point: a
# consumer pins the digest, so a silent edit to a released file is detectable
# rather than merely discouraged.

[coverage]
digest_covers = "all-release-toml-files"
digest_excludes = ["RELEASE.md"]
schema_file_count = 9
fixture_file_count = 8

[skew_policy]
# AD-36: updating both products at HEAD is never sufficient. Every contract
# change tests new backend behaviour against every supported released mobile
# contract, new mobile behaviour against current and staged backend contracts,
# and both products against the previous immutable fixtures.
both_at_head_is_sufficient = false
additive_change = "must-prove-backward-and-forward-behaviour"
incompatible_change = "new-major-release"
coexistence_window_required = true
activation_order = "server-before-client"
minimum_supported_version_policy_required = true
rollback_plan_required = true

[[supported_pair]]
producer = "mobile-v1"
consumer = "backend-v1"
direction = "forward"
expected = "accepted"

[[supported_pair]]
producer = "backend-v1"
consumer = "mobile-v1"
direction = "backward"
expected = "accepted"
