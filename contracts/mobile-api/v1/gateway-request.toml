schema = "supernutrition.mobile-api-gateway-request.v1"
schema_version = 1
release = "v1"
language_neutral = true
executable = false

# Request envelope for the first-party inference gateway.
#
# Every field below carries an explicit type and an explicit optionality marker.
# `optional = false` means the request is rejected when the field is absent
# (missing_required_fields = "reject"). Unknown fields are ignored.

[endpoint]
method = "POST"
path = "/gw/v1/inference/photo"
success_status = 200
# 200, not 201. The gateway durably creates nothing: image bytes are destroyed
# on every terminal path and no row is written for them (AD-8). A 201 with no
# resource and no Location header would describe a resource that does not exist.
success_status_rationale = "gateway-creates-no-durable-resource"

[transport]
content_type = "multipart/form-data"
parts = ["context", "payload"]
context_part_content_type = "application/json"
context_part_schema = "gateway-request.toml [context]"
payload_part_content_types = ["image/jpeg", "image/png", "image/webp"]
payload_max_bytes = 8388608
payload_max_dimension_px = 4096
payload_parts_per_request = 1
# Bytes never travel inside the envelope. A base64 field would inflate the
# payload by a third and place image data inside a structure that is logged in
# other contexts.
payload_in_envelope = false

[[header]]
name = "Authorization"
type = "string"
optional = false
description = "Bearer access token scoped to environment, installation, and gateway surface."

[[header]]
name = "X-Request-Id"
type = "string"
optional = false
pattern = "^req_[A-Za-z0-9]{16,64}$"
description = "One-time request identifier. A replayed value is rejected as token-replayed."

[[header]]
name = "X-Contract-Version"
type = "string"
optional = false
description = "Must equal an entry in the supported release matrix, else unsupported-version."

[[header]]
name = "Idempotency-Key"
type = "string"
optional = true
description = "Replays the stored response for an identical request digest; a differing digest conflicts."

# ---------------------------------------------------------------------------
# context part
# ---------------------------------------------------------------------------

[[context]]
field = "contractVersion"
type = "string"
optional = false
enum = ["mobile-api/v1"]
description = "Release this request is written against. Unsupported values fail with unsupported-version."

[[context]]
field = "attemptId"
type = "string"
optional = false
pattern = "^att_[A-Za-z0-9]{16,64}$"
description = """
Opaque per-attempt identifier, generated client-side from a cryptographic random \
source. Not a UUIDv7: a time-sortable identifier embeds its creation time, and \
this value appears in telemetry where AD-14 permits only an opaque attempt ID. \
Each attempt has at most one active engine and exactly one terminal outcome."""

[[context]]
field = "effectId"
type = "string"
optional = false
pattern = "^eff_[A-Za-z0-9]{16,64}$"
description = """
Identifies the transfer-start effect within the attempt. The gateway records \
at-most-once execution per (attemptId, effectId) so a restored app or a retried \
request cannot start a second transfer (AD-18). A duplicate pair is rejected \
without any provider call. It is not a photo fingerprint: retaking a photo is a \
new effect."""

[[context]]
field = "modality"
type = "string"
optional = false
enum = ["photo"]
reserved_values = ["text"]
description = "Payload kind. Permissions and consent copy are per-modality and never inferred across modalities."

[[context]]
field = "consentReceipt"
type = "object"
optional = false
object_schema = "consent-receipt.toml"
description = "Explicit per-attempt consent bound to the digest of the scrubbed payload. Absent or invalid fails closed."

[[context]]
field = "claimedMarketJurisdiction"
type = "string"
optional = true
nullable = true
pattern = "^[A-Z]{2}$"
description = """
ADVISORY ONLY. The jurisdiction the device believes it is in, used to select \
which policy the gateway looks up first. The gateway resolves the authoritative \
value itself and echoes it in the response. A client cannot widen its own market \
by asserting a more permissive one, and a mismatch is not an error — the \
resolved value simply governs (AD-41 MP-7)."""

[[context]]
field = "inferenceContext"
type = "object"
optional = false
object_schema = "gateway-request.toml [inference_context]"
description = "Immutable per-attempt context captured from the client configuration snapshot."

# `processingRegion` is deliberately absent from the request. Users consent to
# the resulting transfer; they do not select provider routing (AD-41 MP-7).
# A client-supplied preferred region is not accepted, is not honoured, and is
# not silently ignored either — it is simply not part of the envelope.

# ---------------------------------------------------------------------------
# inferenceContext object
# ---------------------------------------------------------------------------

[[inference_context]]
field = "catalogCountry"
type = "string"
optional = false
pattern = "^[A-Z]{2}$"
description = """
Nutrition catalog selection. Independent from jurisdiction and processing \
region: choosing a food catalog is a food-data preference and can never derive, \
widen, or silently change any of them (AD-12, AD-41 MP-6)."""

[[inference_context]]
field = "mealType"
type = "string"
optional = false
enum = ["breakfast", "lunch", "dinner", "snack", "unspecified"]
description = "Meal occasion hint used as inference context only. Never a nutrition input."

[[inference_context]]
field = "locale"
type = "string"
optional = false
format = "BCP 47"
description = "Presentation locale. A separate axis from catalog country and jurisdiction (AD-12)."

[[inference_context]]
field = "measurementSystem"
type = "string"
optional = false
enum = ["metric", "imperial"]
description = "Display units for the client. Does not affect identification."

[[inference_context]]
field = "configurationVersion"
type = "string"
optional = false
description = "Monotonic version of the signed ConfigurationSnapshot this attempt captured (AD-20)."

[[inference_context]]
field = "priorMealSummary"
type = "string"
optional = true
nullable = true
max_length = 280
description = """
Optional second-pass context. Free-form user-derived text: it is passed to the \
provider as delimited data, never as instructions, and is never logged or placed \
in telemetry (AD-14)."""

[validation_order]
# Cheapest rejection first. Every step here must be able to reject the request
# WITHOUT a provider call, because a provider call is the expensive, externally
# visible, privacy-relevant act (E4.3 acceptance criteria).
#
# Owner decision D-02 (2026-08-15) — the order is split into two phases.
#
# The previous single list put `magic-byte-sniff` and `dimension-bounds` ahead of
# `authentication`. That is not implementable for a streamed multipart upload:
# sniffing bytes requires reading bytes, and reading up to 8 MiB of body for an
# unauthenticated caller is a memory-pinning denial of service — one request per
# 8 MiB held. The gateway therefore authenticates first, deliberately, and the
# published list described a request whose body is already in hand: exactly the
# state we refuse to reach for an anonymous caller.
#
# Changing the code to match the old list was refused outright: it reinstates the
# attack. The text was wrong, not the implementation.
#
# What the order guarantees is unchanged and holds in both phases: nothing these
# checks would reject reaches a provider.

# Phase 1 — header-only. Nothing here reads the request body, so each step is
# safe to run for a caller who has not authenticated yet. `streamed-size-guard`
# belongs here because it inspects the declared content length, not the payload.
#
# These two are enforced by the HTTP layer rather than by gateway code:
# `bodyLimit` on the Fastify instance refuses a declared Content-Length over the
# maximum before the body is read AND caps the stream while it is read, and
# @fastify/multipart's `limits` bound file size, file count and field count.
# Named here because a reader looking for a hand-written validator will not find
# one and may conclude the guards are absent.
pre_authentication = [
  "content-length",
  "content-type",
  "streamed-size-guard",
  "contract-version",
]

authentication = "authentication"

# Phase 2 — everything that requires reading the body, or an authenticated
# identity, or both. Ordered cheapest-first within the phase, and every step
# still precedes any provider call.
post_authentication = [
  "magic-byte-sniff",
  "dimension-bounds",
  "request-id-replay",
  "rate-limit",
  "consent-digest-match",
  "modality-and-consent-copy-match",
  "market-posture",
  "processing-region-permitted",
  "effect-deduplication",
]

# Retained as the flat sequence actually executed, so a consumer reading one
# field still sees the whole order. Derived from the two phases above.
order = [
  "content-length",
  "content-type",
  "streamed-size-guard",
  "contract-version",
  "authentication",
  # Byte checks precede the replay claim in execution, and the list now says so.
  # A malformed payload therefore does not burn a one-time request id on its way
  # to being refused. Both orders are safe — neither reaches a provider — but the
  # published sequence has to be the one that runs.
  "magic-byte-sniff",
  "dimension-bounds",
  "request-id-replay",
  "rate-limit",
  "consent-digest-match",
  "modality-and-consent-copy-match",
  "market-posture",
  "processing-region-permitted",
  "effect-deduplication",
]
provider_call_allowed_after = "effect-deduplication"
# No step above may call a provider, in either phase. This is the property the
# ordering exists to protect, and it is unaffected by where authentication sits.
body_read_allowed_after = "authentication"
