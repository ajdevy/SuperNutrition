schema = "supernutrition.mobile-api-error-taxonomy.v1"
schema_version = 1
release = "v1"
language_neutral = true
executable = false

# Complete gateway error catalog.
#
# `gatewayCode` is the stable machine-readable key. It is part of the public
# contract: a key is NEVER renamed, and a wording change edits `userMessageKey`
# or the client's translation, never the key.
#
# Exactly one gatewayCode per failure condition. No two entries share a code.

[policy]
stable_key = "gatewayCode"
key_change_policy = "never-rename-add-new-code-instead"
message_source = "client-side i18n via userMessageKey"
prose_in_response = false
provider_message_in_response = false
internal_detail_in_response = false

# ---------------------------------------------------------------------------
# 400 — the request itself is wrong
# ---------------------------------------------------------------------------

[[error]]
gatewayCode = "validation-error"
httpStatus = 400
userMessageKey = "error.validation"
recoverable = true
retryAfter = 0
description = "Request failed schema validation. `details` lists offending fields."
client_action = "correct-and-resend"

[[error]]
gatewayCode = "invalid-modality"
httpStatus = 400
userMessageKey = "error.invalid_modality"
recoverable = false
retryAfter = 0
description = "Modality is not supported by this release, or does not match the payload part."
client_action = "fall-back-to-manual"

[[error]]
gatewayCode = "malformed-consent"
httpStatus = 400
userMessageKey = "error.consent_malformed"
recoverable = false
retryAfter = 0
description = """
The consent receipt is structurally invalid, or its digest does not match the \
SHA-256 of the received payload. Server-side digest verification is what makes \
the AD-8 binding real rather than a client-side promise."""
client_action = "restart-attempt-with-fresh-consent"

[[error]]
gatewayCode = "consent-expired"
httpStatus = 400
userMessageKey = "error.consent_expired"
recoverable = false
retryAfter = 0
description = "The receipt's expiresAt is in the past at resolution time. Consent is per-attempt and does not persist."
client_action = "re-present-consent-sheet"

[[error]]
gatewayCode = "unsupported-version"
httpStatus = 400
userMessageKey = "error.unsupported_version"
recoverable = false
retryAfter = 0
description = "contractVersion is not in the supported release matrix."
client_action = "prompt-app-update"

# ---------------------------------------------------------------------------
# 401 — the caller is not established
# ---------------------------------------------------------------------------

[[error]]
gatewayCode = "authentication-failed"
httpStatus = 401
userMessageKey = "error.authentication_failed"
recoverable = false
retryAfter = 0
description = "Missing, malformed, or untrusted token, or an environment claim mismatch."
client_action = "re-attest-installation"

[[error]]
gatewayCode = "session-expired"
httpStatus = 401
userMessageKey = "error.session_expired"
recoverable = true
retryAfter = 0
description = "Access token expired. The refresh token may still be valid."
client_action = "refresh-then-retry-once"

[[error]]
gatewayCode = "token-replayed"
httpStatus = 401
userMessageKey = "error.request_replayed"
recoverable = false
retryAfter = 0
description = """
X-Request-Id or the attestation nonce was already used. Replay detection is an \
AD-21 requirement; a retry must carry a fresh request ID, so retrying this one \
can never succeed."""
client_action = "restart-attempt-with-new-request-id"

# ---------------------------------------------------------------------------
# 402 — spend ceiling
# ---------------------------------------------------------------------------

[[error]]
gatewayCode = "budget-exceeded"
httpStatus = 402
userMessageKey = "error.budget_exceeded"
recoverable = false
retryAfter = 0
description = """
The per-principal or per-environment spend cap is exhausted (docs/07 §7.8). \
MVP has no top-up path, so this degrades to the local and manual flows, which \
work without this service. The 402 status is reserved here for a future paid \
tier and carries no payment prompt in v1."""
client_action = "fall-back-to-local-or-manual"

# ---------------------------------------------------------------------------
# 403 — established, but not permitted
# ---------------------------------------------------------------------------

[[error]]
gatewayCode = "consent-required"
httpStatus = 403
userMessageKey = "error.consent_required"
recoverable = false
retryAfter = 0
description = "No valid consent receipt was bound to this payload digest. Fails closed before any provider call."
client_action = "present-consent-sheet"

[[error]]
gatewayCode = "insufficient-scope"
httpStatus = 403
userMessageKey = "error.insufficient_scope"
recoverable = false
retryAfter = 0
description = "The token does not carry the gateway scope."
client_action = "re-attest-installation"

[[error]]
gatewayCode = "market-not-permitted"
httpStatus = 403
userMessageKey = "error.market_not_permitted"
recoverable = false
retryAfter = 0
description = """
The resolved market posture is absent, unresolved, expired, or prohibited for \
this modality. Zero provider calls are made. This is the default state of every \
market until a named legal review sets a posture (AD-41 MP-1)."""
client_action = "fall-back-to-local-or-manual"

[[error]]
gatewayCode = "test-mode-forbidden"
httpStatus = 403
userMessageKey = "error.test_mode_forbidden"
recoverable = false
retryAfter = 0
description = """
A test-mode token attempted a transfer against a non-fixture market. Test mode \
can never cause a real user photo to reach a real provider, in any environment."""
client_action = "no-client-action-configuration-fault"

# ---------------------------------------------------------------------------
# 413 / 415 — the payload is unacceptable
# ---------------------------------------------------------------------------

[[error]]
gatewayCode = "content-too-large"
httpStatus = 413
userMessageKey = "error.content_too_large"
recoverable = false
retryAfter = 0
description = "Payload exceeds the declared maximum. Rejected before the body is read."
client_action = "re-normalize-smaller-and-restart-attempt"

[[error]]
gatewayCode = "unsupported-media-type"
httpStatus = 415
userMessageKey = "error.unsupported_media_type"
recoverable = false
retryAfter = 0
description = "Content type not allowlisted, or magic bytes disagree with the declared type."
client_action = "re-encode-to-allowlisted-type"

# ---------------------------------------------------------------------------
# 429 — throttled
# ---------------------------------------------------------------------------

[[error]]
gatewayCode = "rate-limited"
httpStatus = 429
userMessageKey = "error.rate_limited"
recoverable = true
retryAfter = 30
description = "A rate-limit layer rejected the request. See rate-limit.toml for headers and layers."
client_action = "wait-retry-after-then-retry"

# ---------------------------------------------------------------------------
# 499 — client went away
# ---------------------------------------------------------------------------

[[error]]
gatewayCode = "client-cancelled"
httpStatus = 499
userMessageKey = "error.cancelled"
recoverable = false
retryAfter = 0
description = "The client aborted. Recorded so transfer-state semantics stay auditable; not a server fault."
client_action = "none"

# ---------------------------------------------------------------------------
# 5xx — the service or its upstream failed
# ---------------------------------------------------------------------------

[[error]]
gatewayCode = "internal-error"
httpStatus = 500
userMessageKey = "error.internal"
recoverable = false
retryAfter = 0
description = "Unexpected server fault. No internal detail is leaked to the client."
client_action = "fall-back-to-local-or-manual"

[[error]]
gatewayCode = "provider-unavailable"
httpStatus = 503
userMessageKey = "error.provider_unavailable"
recoverable = true
retryAfter = 60
description = "Upstream provider failed after bounded retries."
client_action = "retry-later-or-fall-back"

[[error]]
gatewayCode = "kill-switch"
httpStatus = 503
userMessageKey = "error.remote_disabled"
recoverable = true
retryAfter = 300
description = """
Remote inference is disabled by operator action (AD-24 kill switch).

DIVERGENCE FROM THE STAGE BRIEF, recorded deliberately. The brief lists this as \
403 / not recoverable. A kill switch is service-side unavailability, not a \
statement about this caller's permissions, and 403 is the wrong semantic. More \
importantly, `recoverable = false` would tell every client to stop retrying \
permanently — so when the operator lifts the switch, the installed base would \
never come back without an app update. 503 with a Retry-After is what makes the \
switch reversible in practice. Matches docs/06 §6.2 and the backend skeleton."""
client_action = "retry-after-then-fall-back"

[[error]]
gatewayCode = "provider-timeout"
httpStatus = 504
userMessageKey = "error.provider_timeout"
recoverable = true
retryAfter = 15
description = "Upstream deadline exceeded within the attempt budget."
client_action = "retry-once-then-fall-back"

# ---------------------------------------------------------------------------
# Invariants the release validator enforces
# ---------------------------------------------------------------------------

[invariants]
unique_gateway_code = true
every_code_has_user_message_key = true
every_code_has_explicit_recoverability = true
non_recoverable_implies_retry_after_zero = true
recoverable_5xx_implies_retry_after_positive = true
http_statuses_used = [400, 401, 402, 403, 413, 415, 429, 499, 500, 503, 504]
