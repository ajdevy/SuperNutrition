# --- superseded --------------------------------------------------------------
#
# These are the digests these releases carried between their publication and
# commit 83547213. They are recorded because the change happened and the record
# should say so, not because they can all be checked.
#
# `reproducible` states, per entry, whether scripts/emit-release-digest.sh can
# recompute the recorded value from the release bytes at recorded_at_commit.
# Three cannot: 83547213 added RELEASE.md to the hashed set, so the algorithm
# that produced them no longer exists in the tree. Recording that honestly is
# the point — an unverifiable number labelled verifiable is worse than one
# labelled unverifiable.

[[entry]]
release_id = "photo-inference-engine/v1"
path = "contracts/inference/v1"
