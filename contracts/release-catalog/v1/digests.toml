algorithm = "release-sha256-v1"
recorded_at_commit = "7e17932c"
status = "superseded"
superseded_by_commit = "83547213"
reproducible = false
note = "release-sha256-v1 excluded RELEASE.md; the v2 algorithm yields 1daedab6751f65c59559bbf7dbb38e7339d2508bda615a5fdc1974e1f967e2af over the same bytes"

