[[entry]]
release_id = "mobile-api/v1"
path = "contracts/mobile-api/v1"
digest = "dbce94511419cf1d54fcc9e52c01314f238b808f6d0603032628365dc0046177"
algorithm = "release-sha256-v2"
recorded_at_commit = "pr/slice-ab-backend-v2"
status = "superseded"
superseded_by_commit = "pr/slice-ab-backend-v2"
note = """
Live-head review of #50. Two corrections to gateway-request.toml, both making \
the published text match what executes rather than changing behaviour:

The flat `order` and the `post_authentication` phase listed `request-id-replay` \
before the byte checks; the code runs the byte checks first, so a malformed \
payload does not burn a one-time request id on its way to being refused. Both \
orders are safe — neither reaches a provider — but the published sequence must \
be the one that runs.

The `pre_authentication` comment now names where `content-length` and \
`streamed-size-guard` are actually enforced: Fastify's `bodyLimit` and \
@fastify/multipart's `limits`, not gateway code. A reviewer looking for a \
hand-written validator concluded the guards were absent; the unused \
`UploadValidator` interface that invited that reading has been removed."""

