schema = "supernutrition.release-catalog.v1"
schema_version = 1

# Append-only record of contract release digests.
#
# WHY THIS EXISTS OUTSIDE THE RELEASES
# Each release records its own digest inside itself, and each validator compares
# a computed digest against that same in-release field. That detects a release
# edited without updating its digest. It cannot detect a release edited together
# with the digest describing it, because the tree is then self-consistent — which
# is what commit 83547213 did to four releases on 2026-07-31, green.
#
# WHY THIS FILE IS NOT THE GATE
# Moving the digest out of the release only relocates the self-reference: an
# attacker edits the release and this file in one commit. The actual gate is
# scripts/verify-release-immutability.sh, which compares against a base revision
# taken from git rather than from any file in the reviewed tree. This catalog is
# the human-readable record; git history is the evidence.
#
# APPEND ONLY. Existing entries are never edited. A release whose digest changes
# gets a new entry with status = "current" and its predecessor set to
# "superseded", which is why entries carry release_id rather than being keyed by
# it — a release legitimately has more than one row over its lifetime.
#
# Produce a digest with: scripts/emit-release-digest.sh <release-root>

# --- current -----------------------------------------------------------------

