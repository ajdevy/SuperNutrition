# --- additions to an already-published release --------------------------------
#
# The same deferred decision as the three edits above, and the larger half of it.
# This slice did not merely amend contracts/mobile-api/v1: it added the entire
# first-party gateway contract surface to it — request and response shapes, the
# error taxonomy, transfer states, consent receipts, rate limits, market policy
# and their canonical fixtures. The review reported three modified files; the
# addition rule added in this change is what surfaced the other fourteen, because
# the gate previously permitted every addition to any release unconditionally.
#
# Fourteen new normative files is not an amendment to v1, it is most of what v1
# now is. That makes the v1-rewrite versus publish-v2 question sharper rather
# than softer, and it remains the contract owner's to answer.

