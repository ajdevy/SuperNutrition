reason = """
M14 — the release shipped with `digest = "pending"`, a self-reference that was \
never computed, so its own verifier compared a digest against the literal \
string "pending" and passed. Computing it is a one-line change to a published \
release, which is exactly what this gate refuses, so it is recorded here rather \
than waved through. Whether market-policy/v1 keeps the corrected digest or the \
correction is published as v2 is the contract owner's call; after `expires` the \
gate fails until one of the two happens."""

