schema = "supernutrition.release-acknowledged-edits.v1"
schema_version = 1

# Named exceptions to the release-immutability gate.
#
# WHAT THIS IS FOR
# scripts/verify-release-immutability.sh freezes the bytes of every published
# contract release. This slice arrived with three files under
# contracts/mobile-api/v1 already modified, and the gate it introduces rejects
# exactly that. Wiring the gate without recording the edits would have meant
# either a permanently red required check or an unwired gate that enforces
# nothing — the second is the state the review found.
#
# WHY IT IS NOT A BASELINE
# A baseline suppresses a class of findings and keeps working as the code moves
# underneath it. Every entry here is pinned to two exact digests: the bytes at
# the base revision and the bytes at the head being reviewed. Edit the file
# again and head_sha256 no longer matches, so the gate fails. Revert it and the
# file stops being modified, so the entry stops applying. An entry cannot
# authorise anything except the precise change it describes, and it cannot
# authorise it for longer than `expires`.
#
# THE DECISION THIS DEFERS
# Whether contracts/mobile-api/v1 should be restored to its published bytes and
# the additions published as mobile-api/v2, or whether v1 is rewritten in place
# and the catalog records the supersession, belongs to the contract owner. It is
# not made here. `expires` is when that decision stops being optional: after it,
# these entries no longer apply and the gate fails until the release is either
# reverted or superseded.
#
# HOW TO ADD ONE
#   git show <base>:<path> | shasum -a 256    -> base_sha256
#   shasum -a 256 <path>                      -> head_sha256

