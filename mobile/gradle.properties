# Shared local/CI Gradle defaults for the mobile product.
# The Intel Mac has 32 GB RAM and six physical cores. Keep enough headroom for
# Kotlin/Native, Compose compilation, Android dexing, and the Kotlin compiler
# daemon without allowing unbounded worker fan-out. A 256 MiB warm heap avoids
# repeated early resizing while staying small next to Android Studio; the 4 GiB
# ceiling is enough for the full KMP/Android/Intel compatibility matrix.
# Detekt/KMP configuration can exceed a 1 GiB class-metadata ceiling; 1.5 GiB
# removes daemon expiry while staying bounded on the 32 GB development host.
org.gradle.jvmargs=-Xms256m -Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC -Dkotlin.daemon.jvm.options=autoshutdownIdleSeconds=1800,shutdownDelayMilliseconds=1000 -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.daemon.idletimeout=1800000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.vfs.watch=true
org.gradle.workers.max=4

# Keep Kotlin compilation in a reusable daemon with a separate, bounded heap.
# Its initial heap follows the same bounded warm-start policy as Gradle's;
# the 2 GB ceiling prevents full KMP compilation from falling back in-process.
kotlin.daemon.jvmargs=-Xms256m -Xmx2g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.useFallbackStrategy=false
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon

# The project uses AndroidX and does not need Jetifier's bytecode rewrite.
android.useAndroidX=true
android.enableJetifier=false
