# The included build only compiles the small convention/policy plugins. Keep
# its independent Kotlin DSL daemon from inheriting an unnecessarily large
# compiler heap intended for the product build.
org.gradle.jvmargs=-Xms128m -Xmx1g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dkotlin.daemon.jvm.options=autoshutdownIdleSeconds=1800,shutdownDelayMilliseconds=1000 -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.daemon.idletimeout=1800000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.vfs.watch=true
org.gradle.workers.max=2

kotlin.daemon.jvmargs=-Xms128m -Xmx768m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.useFallbackStrategy=false
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
