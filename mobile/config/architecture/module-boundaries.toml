schema = "supernutrition.mobile.module-boundaries.v1"
schema_version = 1
product = "mobile"
lifecycle = "active"
owner = "mobile-platform"
source_digest = "local-only"

# This inventory is intentionally explicit before production modules exist.
# Any undeclared module, package prefix, source set, or dependency edge fails
# the later root-policy validator.

[[module]]
id = "mobile-build-policy"
path = "mobile/build-logic"
kind = "policy"
source_sets = ["main", "test"]
production = false

[[module]]
id = "apps"
path = "mobile/apps"
kind = "host-group"
source_sets = ["commonMain", "androidMain", "iosMain"]
production = false

[[module]]
id = "core"
path = "mobile/core"
kind = "library-group"
source_sets = ["commonMain", "commonTest"]
production = false

[[module]]
id = "domain"
path = "mobile/domain"
kind = "pure-kmp-group"
source_sets = ["commonMain", "commonTest"]
production = false

[[module]]
id = "data"
path = "mobile/data"
kind = "adapter-group"
source_sets = ["commonMain", "commonTest", "androidMain", "iosMain"]
production = false

[[module]]
id = "inference"
path = "mobile/inference"
kind = "adapter-group"
source_sets = ["commonMain", "commonTest", "androidMain", "iosMain"]
production = false

[[module]]
id = "platform"
path = "mobile/platform"
kind = "adapter-group"
source_sets = ["commonMain", "commonTest", "androidMain", "iosMain"]
production = false

[[module]]
id = "feature"
path = "mobile/feature"
kind = "compose-feature-group"
source_sets = ["commonMain", "commonTest", "jvmTest", "androidDeviceTest", "iosSimulatorArm64Test", "iosX64Test"]
production = false

# These exact host roles keep the stable feature paths while making their
# composition-root and presentation dependencies auditable.
[[module]]
id = "feature-host"
path = "mobile/feature/photo-analysis"
kind = "composition-root"
source_sets = ["commonMain", "commonTest", "jvmTest", "androidMain", "androidDeviceTest", "iosMain", "iosSimulatorArm64Test", "iosX64Test"]
production = false

[[module]]
id = "feature-meal-search-presenter"
path = "mobile/feature/meal-search-presenter"
kind = "presentation"
source_sets = ["commonMain", "commonTest", "jvmTest"]
production = false

[[module]]
id = "feature-presenter"
path = "mobile/feature/photo-analysis-presenter"
kind = "presentation"
source_sets = ["commonMain", "commonTest", "jvmTest", "iosMain", "iosSimulatorArm64Test", "iosX64Test"]
production = false

[[module]]
id = "feature-ui"
path = "mobile/feature/photo-analysis-ui"
kind = "compose-ui"
source_sets = ["commonMain", "commonTest", "jvmTest", "iosMain", "iosSimulatorArm64Test", "iosX64Test"]
production = false

[[module]]
id = "testing"
path = "mobile/testing"
kind = "test-support-group"
source_sets = ["commonMain", "commonTest", "jvmTest", "androidDeviceTest", "iosSimulatorArm64Test", "iosX64Test"]
production = false

[[module]]
id = "evaluation"
path = "mobile/evaluation"
kind = "evidence-group"
source_sets = ["jvmTest", "androidDeviceTest", "iosSimulatorArm64Test", "iosX64Test"]
production = false

[[allowed_edge]]
from = "apps"
to = "feature|feature-host|feature-presenter|feature-ui|platform|inference|data|core"
scope = "production"

[[allowed_edge]]
from = "apps"
to = "domain|testing|platform"
scope = "test-only"

[[allowed_edge]]
from = "feature-host"
to = "feature-presenter|feature-ui|platform|domain|core"
scope = "production"

[[allowed_edge]]
from = "feature-ui"
to = "feature-presenter|domain|core"
scope = "production"

[[allowed_edge]]
from = "feature-presenter"
to = "domain|core"
scope = "production"

# Same shape as feature-presenter above, declared separately because edges are
# keyed by module id and ids are unique — the photo presenter holds the plain
# role name. A second presenter is a second edge to declare rather than a rule
# to loosen, which is the point of an inventory that fails on anything
# undeclared.
[[allowed_edge]]
from = "feature-meal-search-presenter"
to = "domain|core"
scope = "production"

[[allowed_edge]]
from = "feature"
to = "domain|core"
scope = "production"

[[allowed_edge]]
from = "platform|inference|data"
to = "domain|core"
scope = "production"

[[allowed_edge]]
from = "domain"
to = "domain|core"
scope = "production"

[[allowed_edge]]
from = "testing|evaluation"
to = "declared-tested-module|testing"
scope = "test-only"

[[allowed_edge]]
from = "feature-host"
to = "feature-ui|feature-presenter|core|testing"
scope = "test-only"

forbidden_imports = [
  "android.* in mobile/domain/**",
  "platform.* in mobile/domain/**",
  "androidx.compose.* in mobile/domain/**",
  "org.koin.* in mobile/domain/**",
  "io.ktor.* in mobile/domain/**",
  "app.cash.sqldelight.* in mobile/domain/**",
  "mobile.testing.* in distributable configurations",
]
