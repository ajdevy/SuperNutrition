schema = "supernutrition.mobile.coverage-inventory.v1"
schema_version = 1
product = "mobile"
lifecycle = "active"
source_digest = "local-only"
quality_claim = true
production_source_count = 15
denominator_count = 15
minimum_line_percent = 85
minimum_branch_percent = 85
changed_line_percent = 100
changed_branch_percent = 100
native_equivalent_evidence_required = true
optional_apple_evidence_allowed = true
empty_or_zero_denominator = "fail"
# Branchless production adapters must still have a non-empty line denominator;
# only their absent branch counter may be excluded from the aggregate branch
# denominator. All present branch counters remain mandatory.
branchless_branch_counter_policy = "exclude-absent-branch-counter-only"
status = "active-local"
# Authoritative output of qualityCoverageJvm in qualityCheckJvmAndroid.
# It covers the ten JVM-observable production modules; native-equivalent
# modules remain bound to the explicit physical-device records below.
local_aggregate_line_percent = "pending"
local_aggregate_branch_percent = "pending"
local_aggregate_status = "pending"

# Every compiled production unit has exactly one denominator. JVM observations
# below are local-only measurements; native-equivalent records are bound to
# executable Android evidence. Apple evidence is optional for activation, and
# pending optional records are never counted as successful evidence.
[[denominator]]
id = "data-nutrition"
unit_id = "data-nutrition"
source_path = "mobile/data/nutrition"
coverage_kind = "jvm"
test_task = ":data:nutrition:jvmTest"
line_minimum_percent = 85
branch_minimum_percent = 85
changed_line_minimum_percent = 100
changed_branch_minimum_percent = 100
observed_line_percent = "96.8338"
