# Local development dependencies only. This file is not a deployment artifact.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supernutrition
      POSTGRES_PASSWORD: supernutrition
      POSTGRES_DB: supernutrition
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supernutrition']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
