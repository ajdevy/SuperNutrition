# AD-9: model selection is configuration, not code. This is the ONLY file in the
# product that may contain a model identifier; a test asserts that
# (apps/api/src/modules/inference/domain/inference.invariants.test.ts).
#
# The active configuration is identified by an immutable version reported in
# provenance and recorded in inference_runs, so any past result traces to the
# exact roster that produced it.
schema = "supernutrition.backend.model-profiles.v1"
schema_version = 1
profile_version = "2026-07-29.2"
rollback_target = "2026-07-29.1"
# Benchmark: backend/benchmark/results/BENCHMARK-REPORT.md
# 2026-07-29 — swapped fast-identify/fast-identify-fallback roles and fixed
#   Claude Sonnet model ID based on live benchmark results.
#   Key findings: GPT-4o-mini more accurate but 13x more tokens than Gemini.
#   Gemini 2.5 Flash 8x cheaper with detailed ingredient breakdown.
#   Claude Sonnet 5 enabled — slow (4.1s avg) but best multi-food detail.

[routing]
confidence_threshold = 0.75
accept_band = "high"
max_passes = 2
pass_deadline_ms = 8000
total_deadline_ms = 20000

# Primary Pass 1 — higher accuracy, serves as the main identifier.
# Benchmark: 5/5 success, 87% avg confidence, $0.0039/req, 2.35s, 25600 tokens.
[[profile]]
id = "fast-identify"
pass = 1
provider = "openrouter"
model = "openai/gpt-4o-mini"
max_output_tokens = 1024
temperature = 0.0
cost_per_1k_input_micros = 150
cost_per_1k_output_micros = 600
enabled = true

# Fallback Pass 1 — cheap, detailed ingredient breakdown.
# Benchmark: 4/5 success, 78% avg confidence, $0.0005/req, 2.06s, 1900 tokens.
# Best for detailed multi-food identification when fast-identify is uncertain.
[[profile]]
id = "fast-identify-fallback"
pass = 1
provider = "openrouter"
model = "google/gemini-2.5-flash"
max_output_tokens = 1024
temperature = 0.0
cost_per_1k_input_micros = 75
cost_per_1k_output_micros = 300
enabled = true

# Pass 2 — high confidence confirmation.
# Benchmark: 5/5 success, 95% avg confidence, $0.0027/req, 1.94s, 890 tokens.
[[profile]]
id = "deep-identify"
pass = 2
provider = "openrouter"
model = "openai/gpt-4o"
max_output_tokens = 2048
temperature = 0.0
cost_per_1k_input_micros = 2500
cost_per_1k_output_micros = 10000
enabled = true

# Pass 2 alt — best multi-food ingredient detail.
# Benchmark: 5/5 success, 78% avg confidence, $0.0050/req, 4.11s, 1170 tokens.
# Fixed model ID from anthropic/claude-sonnet -> anthropic/claude-sonnet-5.
[[profile]]
id = "deep-identify-alt"
pass = 2
provider = "openrouter"
model = "anthropic/claude-sonnet-5"
max_output_tokens = 2048
temperature = 0.0
cost_per_1k_input_micros = 2000
cost_per_1k_output_micros = 10000
enabled = true
