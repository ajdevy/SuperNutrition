workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - quality
  - aggregate

default:
  image: ubuntu:24.04
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl git openjdk-21-jdk python3 unzip
    - chmod +x mobile/gradlew web/landing/quality-check backend/mobile-api/quality-check scripts/*.sh
  cache:
    key: "gradle-${CI_COMMIT_REF_SLUG}"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

variables:
  GIT_DEPTH: "0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

.fingerprint_artifact: &fingerprint_artifact
  when: always
  expire_in: 3 days
  paths:
    - ci-fingerprints/

quality-linux:
  stage: quality
  script:
    - scripts/verify-root-boundaries.sh
    - scripts/root-boundary-negative-fixtures.sh
    - scripts/verify-ci-policy.sh
    - scripts/ci-policy-negative-fixtures.sh
    - scripts/verify-product-identity.sh
    - scripts/product-identity-negative-fixtures.sh
    - scripts/verify-mobile-api-contract.sh
    - scripts/mobile-api-contract-negative-fixtures.sh
    - scripts/verify-interaction-policy-contract.sh
    - scripts/interaction-policy-contract-negative-fixtures.sh
    - ./mobile/gradlew -p mobile verifyMobilePolicy --dependency-verification=strict --no-daemon --no-configuration-cache
    - mkdir -p ci-fingerprints
    - scripts/emit-ci-fingerprint.sh quality-linux ci-fingerprints/quality-linux.fingerprint
  artifacts:
    <<: *fingerprint_artifact

ui-journeys-android:
  stage: quality
  script:
    - scripts/run-ui-journeys-android.sh
    - mkdir -p ci-fingerprints
    - scripts/emit-ci-fingerprint.sh ui-journeys-android ci-fingerprints/ui-journeys-android.fingerprint
  artifacts:
    <<: *fingerprint_artifact

quality-apple:
  stage: quality
  script:
    - ./mobile/gradlew -p mobile qualityCheckApple --dependency-verification=strict --no-daemon --no-configuration-cache
    - mkdir -p ci-fingerprints
    - scripts/emit-ci-fingerprint.sh quality-apple ci-fingerprints/quality-apple.fingerprint
  artifacts:
    <<: *fingerprint_artifact

ui-journeys-ios:
  stage: quality
  script:
    - scripts/run-ui-journeys-ios.sh
    - mkdir -p ci-fingerprints
    - scripts/emit-ci-fingerprint.sh ui-journeys-ios ci-fingerprints/ui-journeys-ios.fingerprint
  artifacts:
    <<: *fingerprint_artifact

quality-web-landing:
  stage: quality
  script:
    - web/landing/quality-check
    - mkdir -p ci-fingerprints
    - scripts/emit-ci-fingerprint.sh quality-web-landing ci-fingerprints/quality-web-landing.fingerprint
  artifacts:
    <<: *fingerprint_artifact

quality-backend:
  stage: quality
  script:
    - backend/mobile-api/quality-check
    - mkdir -p ci-fingerprints
    - scripts/emit-ci-fingerprint.sh quality-backend ci-fingerprints/quality-backend.fingerprint
  artifacts:
    <<: *fingerprint_artifact

ci-required:
  stage: aggregate
  when: always
  needs:
    - job: quality-linux
      artifacts: true
    - job: ui-journeys-android
      artifacts: true
    - job: quality-apple
      artifacts: true
    - job: ui-journeys-ios
      artifacts: true
    - job: quality-web-landing
      artifacts: true
    - job: quality-backend
      artifacts: true
  script:
    - test "$(find ci-fingerprints -maxdepth 1 -type f -name '*.fingerprint' | wc -l | tr -d ' ')" = 6
    - SUPERNUTRITION_CI_FINGERPRINT_ROOT="$CI_PROJECT_DIR/ci-fingerprints" SUPERNUTRITION_EXPECTED_SHA="$CI_COMMIT_SHA" scripts/verify-ci-fingerprints.sh
    - mkdir -p governance-attestation
    - printf 'schema=supernutrition.gitlab.governance-attestation.v1\nsource_project_id=84888824\nsource_pipeline_id=%s\nsource_commit_sha=%s\nstatus=success\n' "$CI_PIPELINE_ID" "$CI_COMMIT_SHA" > governance-attestation/ci-required.attestation
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - ci-fingerprints/
      - governance-attestation/

governance-audit:
  stage: aggregate
  needs:
    - job: ci-required
      artifacts: true
  trigger:
    project: flexsentlabs/supernutrition-governance
    branch: main
    strategy: depend
  variables:
    SOURCE_PROJECT_ID: "84888824"
    SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    SOURCE_SHA: "$CI_COMMIT_SHA"
