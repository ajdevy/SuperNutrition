name: mobile-unit-coverage

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mobile-unit-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate released inference contract
        run: scripts/verify-inference-contract.sh
      - name: Run inference contract negative fixtures
        run: scripts/inference-contract-negative-fixtures.sh
      - name: Verify repository root boundaries
        run: scripts/verify-root-boundaries.sh
      - name: Run mobile JVM unit tests with coverage
        run: >-
          ./mobile/gradlew -p mobile mobileUnitCoverage
          -Psupernutrition.runJvmCoverage=true
          --dependency-verification=strict
          --no-daemon
          --no-configuration-cache
          --max-workers=1
