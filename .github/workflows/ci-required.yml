name: mobile-unit-coverage

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-unit-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 21 and Gradle cache
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate released inference contract
        run: scripts/verify-inference-contract.sh
      - name: Run inference contract negative fixtures
        run: scripts/inference-contract-negative-fixtures.sh
      - name: Run inference v2 negative fixtures
        run: scripts/inference-v3-negative-fixtures.sh
      - name: Verify the v2 schema and its Kotlin binding agree
        run: scripts/verify-inference-v3-binding.sh
      - name: Run v2 schema-to-binding negative fixtures
        run: scripts/inference-v3-binding-negative-fixtures.sh
      - name: Validate market policy contract and instance
        run: scripts/verify-market-policy-contract.sh
      - name: Run market policy negative fixtures
        run: scripts/market-policy-negative-fixtures.sh
      - name: Verify repository root boundaries
        run: scripts/verify-root-boundaries.sh
      - name: Test report generators
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Run mobile JVM coverage and generate reports
        run: >-
          ./mobile/gradlew -p mobile mobileUnitCoverage mobileCoverageReports
          -Psupernutrition.runJvmCoverage=true
          --dependency-verification=strict
          --no-daemon
          --configuration-cache
          --max-workers=1
      - name: Build static coverage dashboard
        run: python3 scripts/build_coverage_site.py --output-dir _site
      - name: Verify README coverage snapshot
        run: >-
          python3 scripts/update_readme_metrics.py
          --readme README.md
          --site-dir _site
          --check
      - name: Upload JVM reports and coverage dashboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mobile/**/build/reports/kover/**
            _site/**
          if-no-files-found: error
          retention-days: 14
