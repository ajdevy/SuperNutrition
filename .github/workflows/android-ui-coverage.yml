name: android-ui-coverage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ui-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM for Android emulator
        run: |
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
          else
            echo '/dev/kvm is unavailable; the runner will use the emulator software fallback' >&2
          fi
      - name: Run Android instrumentation and Maestro UI tests
        run: scripts/run-ui-journeys-android.sh
      - name: Upload Android UI reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-ui-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/supernutrition-ui-android/emulator.log
            ${{ runner.temp }}/supernutrition-ui-android/logcat.log
            ${{ runner.temp }}/supernutrition-ui-android/ui-hierarchy.xml
            ${{ runner.temp }}/supernutrition-ui-android/report/junit.xml
            ${{ runner.temp }}/supernutrition-ui-android/report/android-instrumentation-files.txt
            mobile/apps/androidApp/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: error
          retention-days: 14
